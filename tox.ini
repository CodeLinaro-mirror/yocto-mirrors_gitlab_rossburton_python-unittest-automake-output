[tox]
requires = tox>=4
isolated_build = True
env_list =
    format
    py38
    py310
    py312

[testenv]
description = run unit tests
deps = pytest
change_dir = {tox_root}/tests
commands = python3 -munittest --verbose

[testenv:format]
description = install black in a virtual environment and invoke it on the current folder
deps = black
skip_install = true
commands = black .
