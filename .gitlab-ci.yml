image: python:latest

build:
  stage: build
  script:
    - python3 -mvenv venv
    - . venv/bin/activate
    - pip install . pytest
    - cd tests
    - python3 -munittest --verbose

black:
  stage: test
  image: registry.gitlab.com/pipeline-components/black:latest
  script:
    - black --verbose --check -- .
