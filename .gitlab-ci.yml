image: python:latest

build:
  stage: build
  script:
    - pip3 install flit
    - flit build
  artifacts:
    paths:
      - dist/

test:
  image: "python:$VERSION"
  stage: test
  parallel:
    matrix:
      - VERSION: ['3.10', '3.11', '3.12', '3.13', 'latest']
  script:
    - pip3 install tox
    - tox
